name: Release

on:
  push:
    branches:
      - main

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: changesets/action@v1
        id: changesets
        with:
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # changesets/action tags only what it can parse out of the publish
      # command's stdout — the `New tag:` lines that `changeset publish` prints.
      # We publish with `pnpm publish -r` instead, because that is what rewrites
      # `workspace:*` ranges into real versions on the way to npm, and it prints
      # nothing of the sort. So npm advanced on every release and git stood
      # still: tags stop at v0.1.2 while npm is on 1.0.18.
      #
      # `changeset tag` creates exactly the tags changesets would have, from the
      # versions on disk, and skips any that already exist — so a push that
      # publishes nothing is a no-op.
      - name: Tag published versions
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm changeset tag
          git push --tags

          # One release entry for the lockstep version, so the Releases page
          # shows a single readable snapshot rather than eight package tags.
          VERSION=$(node -p "require('./packages/core/package.json').version")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — nothing to publish."
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes
          fi