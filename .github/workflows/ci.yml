name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Root `pnpm build` filters to ./packages/**, so nothing here consumed the
      # published packages the way an app does. The docs app resolves them
      # through its own vite aliases, which means a new subpath in an exports map
      # can resolve fine for every package and still break the app — and only
      # the post-merge Deploy Docs job would say so. Build it here instead.
      - name: Build docs app
        run: pnpm turbo run build --filter=@scrivr/docs...
